name: checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.lock
      - run: .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - run: .venv/bin/python -m ruff check src tests
      - run: .venv/bin/python -m pytest -q

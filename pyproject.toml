[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "auto-agents-2"
version = "0.1.0"
description = "Durable, evidence-driven software development orchestration"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3", "typer>=0.15,<1", "rich>=13,<16",
  "prompt-toolkit>=3.0,<4", "httpx>=0.27,<1", "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "hatchling>=1.25,<2", "editables>=0.5,<1"]
browser = ["playwright>=1.50,<2"]

[project.scripts]
aa2 = "auto_agents_2.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_agents_2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
